[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-information-dynamics"
version = "0.1.0"
description = "Reference model implementation and research evidence for structured latent-state dynamics"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "pandas>=2.0", "xarray>=2023.1", "netcdf4>=1.6", "cdsapi>=0.7", "huggingface-hub>=0.20", "jupyterlab>=4.0", "nbformat>=5.9"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
